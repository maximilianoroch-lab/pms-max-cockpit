name: Verify desktop Python
on:
  pull_request:
  push:
    branches:
      - feature/cash-multimoneda-auditoria
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile app.py data.py portfolio_config.py
      - run: python -m pip install -r requirements.txt
      - name: Start Streamlit and check health
        shell: bash
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/pms-streamlit.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health | grep -q ok; then
              echo "Streamlit health: OK"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pms-streamlit.log
          exit 1
