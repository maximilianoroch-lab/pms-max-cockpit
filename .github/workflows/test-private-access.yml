name: Private personal access and legacy snapshot regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_personal_user_access tests.test_private_sheet_reader -v
      - run: node --test ops/apps_script/test_legacy_snapshot_safe.cjs
