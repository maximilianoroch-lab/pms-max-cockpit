name: ETF materiality policy regression
on:
  pull_request:
    paths:
      - 'pms_etf_materiality.py'
      - 'tests/test_pms_etf_materiality.py'
      - '.github/workflows/test-etf-materiality.yml'
  workflow_dispatch:
jobs:
  candidate-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - run: python -m unittest tests.test_pms_etf_materiality -v
