name: Production reachability smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-smoke.yml']
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
jobs:
  deployed-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed Streamlit HTTP endpoints
        env:
          BERSOCH_URL: https://pms-max.streamlit.app/
          DEMO_URL: https://demo-pms-max-mxqteogjttzuufoah5nwnj.streamlit.app/
        run: |
          python - <<'PY'
          import os, time, urllib.request, urllib.error, sys
          failed = []
          for key in ("BERSOCH_URL", "DEMO_URL"):
              url = os.environ[key]
              # Streamlit Community Cloud can redirect unauthenticated probes
              # to an identity/sleeping-app gateway. Report that distinctly.
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 PMS-Smoke/1.0"})
                      with urllib.request.urlopen(req, timeout=25) as res:
                          code, body = res.status, res.read(1024*1024)
                          final = res.url
                      print(f"{key} attempt={attempt} http={code} bytes={len(body)} final={final}")
                      if code == 200 and body and "streamlit" in body.decode("utf-8","ignore").lower():
                          break
                      raise ValueError("Unexpected HTTP or HTML content")
                  except urllib.error.HTTPError as exc:
                      if exc.code == 303:
                          print(f"{key}: Streamlit gateway returned HTTP 303 redirect loop; browser validation required.")
                          failed.append(key+" (gateway 303)")
                          break
                      print(f"{key} attempt={attempt}: HTTP {exc.code}")
                      if attempt == 3: failed.append(key)
                      else: time.sleep(12)
                  except Exception as exc:
                      print(f"{key} attempt={attempt}: {type(exc).__name__}: {exc}")
                      if attempt == 3: failed.append(key)
                      else: time.sleep(12)
          if failed:
              print("Failed endpoints:", ",".join(failed))
              sys.exit(1)
          print("Both deployment landing pages reachable; this is NOT interactive UI validation.")
          PY
