name: Verify production PMS Bersoch (HTTP only)
on:
  pull_request:
    paths:
      - 'ops/production_reachability.py'
      - 'ops/test_production_reachability.py'
      - '.github/workflows/verify-production.yml'
  push:
    branches: [main]
    paths:
      - 'ops/production_reachability.py'
      - 'ops/test_production_reachability.py'
      - '.github/workflows/verify-production.yml'
  workflow_dispatch:
jobs:
  probe-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test HTTP reachability classifications (offline)
        run: python -m unittest ops.test_production_reachability -v
      - name: Probe published HTML endpoints; never certify functional deployment
        if: github.event_name == 'workflow_dispatch'
        run: python ops/production_reachability.py
