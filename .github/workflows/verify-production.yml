name: Verify production PMS Bersoch
on:
  push:
    paths:
      - .github/workflows/verify-production.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed sites
        run: |
          python3 - <<'PY'
          import urllib.request
          endpoints={
           'STREAMLIT':'https://pms-max.streamlit.app/',
           'MOBILE':'https://pms-bersoch-mobile.netlify.app/'
          }
          for label,url in endpoints.items():
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=20) as r:
             data=r.read(1200000).decode('utf-8','replace')
             print(label,'HTTP',r.status,'URL',r.geturl(),'BYTES',len(data),
                   'HISTORICAL_SHEET',('evolucion_tipo_mensual_estimado' in data),
                   'YEAR_MARKERS',('stroke-dasharray' in data),
                   'MOBILE_34_MONTHS',('monthlySeries(rows)' in data))
           except Exception as e:print(label,'ERROR',type(e).__name__,str(e)[:240])
          PY
