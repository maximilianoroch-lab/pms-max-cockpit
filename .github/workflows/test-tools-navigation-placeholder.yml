name: Navigation placeholder regression
on:
  pull_request:
  workflow_dispatch:
jobs:
  navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest ops.test_tools_navigation_placeholder -v
