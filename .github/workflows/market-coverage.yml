name: Audit 2024-2026 market price coverage
on:
  push:
    paths:
      - '.github/workflows/market-coverage.yml'
      - 'ops/market_coverage_audit.py'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests pandas
      - name: Collect historical coverage (no positions exported)
        run: python -m ops.market_coverage_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-market-coverage
          path: market_audit/
          if-no-files-found: warn
