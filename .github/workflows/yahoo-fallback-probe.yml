name: Yahoo fallback coverage probe
on:
  push:
    paths: ['.github/workflows/yahoo-fallback-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Argentine ticker historical fallback
        run: |
          python - <<'PY'
          import urllib.request,json,datetime
          symbols=['AN29','AO28','AO29','GD41','LAC','LAR','NU','PEP','VIST']
          for t in symbols:
            url=f'https://query1.finance.yahoo.com/v8/finance/chart/{t}.BA?range=3y&interval=1mo'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=12) as r:
                data=json.load(r)
              res=data.get('chart',{}).get('result') or []
              ts=res[0].get('timestamp') or [] if res else []
              print(t, 'monthly bars',len(ts),'first',datetime.datetime.fromtimestamp(ts[0],datetime.timezone.utc).date() if ts else '-')
            except Exception as e:print(t,'ERROR',str(e)[:120])
          PY
